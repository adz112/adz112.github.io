  <!-- Main -->
  <main class="main">

    <!-- Contact Section -->
    <section id="contact" class="contact section">

      <!-- Section Title -->
      <div class="container section-title" data-aos="fade-up">
        <h2>Contact</h2>
      </div>

      <div class="container" data-aos="fade-up" data-aos-delay="100">

        <div class="row g-4 g-lg-5">

          <div class="col-lg-5">

            <div class="info-box" data-aos="fade-up" data-aos-delay="200">

              <h3>Susisiekite</h3>

              <p>Užpildykite formą ir įvertinkite svetainę.</p>

              <!-- Contact Form -->
              <form id="kontaktu-forma" class="contact-form" novalidate>

                <div class="row gy-4">

                  <!-- Vardas -->
                  <div class="col-md-6">

                    <input
                      type="text"
                      name="vardas"
                      class="form-control"
                      placeholder="Vardas"
                      required>

                    <div class="klaida-tekstas"></div>

                  </div>

                  <!-- Pavardė -->
                  <div class="col-md-6">

                    <input
                      type="text"
                      name="pavarde"
                      class="form-control"
                      placeholder="Pavardė"
                      required>

                    <div class="klaida-tekstas"></div>

                  </div>

                  <!-- El. paštas -->
                  <div class="col-md-6">

                    <input
                      type="email"
                      name="email"
                      class="form-control"
                      placeholder="El. paštas"
                      required>

                    <div class="klaida-tekstas"></div>

                  </div>

                  <!-- Telefonas -->
                  <div class="col-md-6">

                    <input
                      type="tel"
                      name="telefonas"
                      class="form-control"
                      placeholder="Tel. numeris (+370 6xx xxxxx)"
                      maxlength="14"
                      required>

                    <div class="klaida-tekstas"></div>

                  </div>

                  <!-- Adresas -->
                  <div class="col-12">

                    <input
                      type="text"
                      name="adresas"
                      class="form-control"
                      placeholder="Adresas"
                      required>

                    <div class="klaida-tekstas"></div>

                  </div>

                  <!-- Klausimas 1 -->
                  <div class="col-md-4">

                    <label for="klausimas1">
                      Kaip vertinate svetainės dizainą? (1–10)
                    </label>

                    <input
                      type="number"
                      id="klausimas1"
                      name="klausimas1"
                      class="form-control vertinimas"
                      min="1"
                      max="10"
                      required>

                    <div class="klaida-tekstas"></div>

                  </div>

                  <!-- Klausimas 2 -->
                  <div class="col-md-4">

                    <label for="klausimas2">
                      Kaip vertinate pateiktą informaciją? (1–10)
                    </label>

                    <input
                      type="number"
                      id="klausimas2"
                      name="klausimas2"
                      class="form-control vertinimas"
                      min="1"
                      max="10"
                      required>

                    <div class="klaida-tekstas"></div>

                  </div>

                  <!-- Klausimas 3 -->
                  <div class="col-md-4">

                    <label for="klausimas3">
                      Ar rekomenduotumėte mane kitiems? (1–10)
                    </label>

                    <input
                      type="number"
                      id="klausimas3"
                      name="klausimas3"
                      class="form-control vertinimas"
                      min="1"
                      max="10"
                      required>

                    <div class="klaida-tekstas"></div>

                  </div>

                  <!-- Buttons -->
                  <div class="col-12 text-center">

                    <button
                      type="submit"
                      id="siusti-btn"
                      class="btn"
                      disabled>
                      Siųsti
                    </button>

                    <button
                      type="button"
                      id="isvalyti-btn"
                      class="btn btn-isvalyti">
                      Išvalyti
                    </button>

                  </div>

                </div>

              </form>

              <!-- Results -->
              <div id="formos-rezultatas"></div>

            </div>

          </div>

        </div>

      </div>

    </section>
